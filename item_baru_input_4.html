<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Input Item Baru</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; background:#f5f5f5; }
  h2 { text-align: center; }
  label { display: block; margin-top: 14px; font-weight: bold; font-size: 14px; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 15px; }
  .dims { display: flex; gap: 8px; }
  .dims input { width: 100%; }
  button { width: 100%; padding: 12px; margin-top: 22px; background: #2563eb; color: white; border: none;
           border-radius: 6px; font-size: 16px; cursor: pointer; }
  button:disabled { background: #999; }
  #msg { margin-top: 14px; text-align: center; font-weight: bold; }
  #volumePreview { margin-top: 6px; font-size: 13px; color: #555; }
  .ok { color: green; }
  .err { color: red; }
</style>
</head>
<body>

<h2>Input Item Baru</h2>
<p style="text-align:center; color:#999; font-size:12px;">build: TEST-v3-hardened</p>

<form id="itemForm">
  <label>Product Name</label>
  <input type="text" id="product_name" required>

  <label>Division</label>
  <select id="division" required>
    <option value="">-- Pilih Division --</option>
    <option>BERAS</option>
    <option>MINYAK</option>
    <option>GULA</option>
    <option>TEPUNG</option>
    <option>LAINNYA</option>
  </select>

  <label>Product Group</label>
  <select id="product_group" required>
    <option value="">-- Pilih Product Group --</option>
    <option>BARANG KEBUTUHAN POKOK</option>
    <option>BARANG UMUM</option>
    <option>ELEKTRONIK</option>
    <option>LAINNYA</option>
  </select>

  <label>Buying Price</label>
  <input type="number" step="any" id="buying_price" required>

  <label>Selling Price</label>
  <input type="number" step="any" id="selling_price" required>
  <div id="priceWarning" class="err"></div>

  <label>Satuan Besar</label>
  <select id="satuan_besar" required>
    <option value="">-- Pilih Satuan Besar --</option>
    <option>KRT</option>
    <option>ZAK</option>
  </select>

  <label>Satuan Kecil</label>
  <select id="satuan_kecil" required>
    <option value="">-- Pilih Satuan --</option>
    <option>PAK</option>
    <option>PCS</option>
    <option>LSN</option>
    <option>ZAK</option>
  </select>

  <label>1 Karton Isi Berapa Satuan Kecil</label>
  <input type="number" id="isi_per_karton" required>

  <label>Ukuran Karton (cm) — Panjang / Lebar / Tinggi</label>
  <div class="dims">
    <input type="number" id="panjang_cm" placeholder="P" min="1" max="100" required>
    <input type="number" id="lebar_cm" placeholder="L" min="1" max="100" required>
    <input type="number" id="tinggi_cm" placeholder="T" min="1" max="100" required>
  </div>
  <div id="volumePreview">Volume: -</div>

  <button type="submit" id="submitBtn">Submit</button>
  <div id="msg"></div>
</form>

<script>
  alert("JS TEST: JavaScript berjalan di halaman ini.");

  // Catch ANY script error and show it directly on the page (no DevTools needed)
  window.onerror = function(message, source, lineno, colno, error) {
    const msgBox = document.getElementById("msg");
    if (msgBox) {
      msgBox.textContent = "SCRIPT ERROR: " + message + " (line " + lineno + ")";
      msgBox.className = "err";
    }
    return false;
  };

  let supabase;
  try {
    if (!window.supabase) {
      throw new Error("Supabase library gagal dimuat dari internet (cek koneksi / firewall).");
    }
    const SUPABASE_URL = "https://swxgkuaoctrcfbgncwaz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_0e8sOfljWkkin-hwhNweEw_CWqt1Az-";
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (err) {
    // DOM already exists at this point since this script sits at the bottom of <body>
    const msgBox = document.getElementById("msg");
    msgBox.textContent = "INIT ERROR: " + err.message;
    msgBox.className = "err";
  }

  const form = document.getElementById("itemForm");
  const msg = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");
  const buyingInput = document.getElementById("buying_price");
  const sellingInput = document.getElementById("selling_price");
  const priceWarning = document.getElementById("priceWarning");
  const panjangInput = document.getElementById("panjang_cm");
  const lebarInput = document.getElementById("lebar_cm");
  const tinggiInput = document.getElementById("tinggi_cm");
  const volumePreview = document.getElementById("volumePreview");

  function checkPrices() {
    const buy = parseFloat(buyingInput.value);
    const sell = parseFloat(sellingInput.value);
    const invalid = isNaN(buy) || isNaN(sell) || sell < buy;
    if (!isNaN(buy) && !isNaN(sell) && sell < buy) {
      priceWarning.textContent = "Selling price tidak boleh lebih rendah dari buying price!";
    } else {
      priceWarning.textContent = "";
    }
    submitBtn.disabled = invalid; // hard block: button literally cannot be clicked while invalid
    return !invalid;
  }

  function updateVolumePreview() {
    const p = parseFloat(panjangInput.value);
    const l = parseFloat(lebarInput.value);
    const t = parseFloat(tinggiInput.value);
    if (!isNaN(p) && !isNaN(l) && !isNaN(t)) {
      const volume = (p * l * t) / 1000000;
      volumePreview.textContent = "Volume: " + volume.toFixed(6) + " m3";
    } else {
      volumePreview.textContent = "Volume: -";
    }
  }

  buyingInput.addEventListener("input", checkPrices);
  sellingInput.addEventListener("input", checkPrices);
  [panjangInput, lebarInput, tinggiInput].forEach(el => el.addEventListener("input", updateVolumePreview));
  checkPrices(); // set initial button state on page load

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!supabase) {
      msg.textContent = "Supabase belum siap. Refresh halaman dan cek koneksi internet.";
      msg.className = "err";
      return;
    }

    if (!checkPrices()) {
      msg.textContent = "Perbaiki harga sebelum submit.";
      msg.className = "err";
      return;
    }

    const p = parseFloat(panjangInput.value);
    const l = parseFloat(lebarInput.value);
    const t = parseFloat(tinggiInput.value);
    if ([p, l, t].some(v => isNaN(v) || v <= 0 || v > 100)) {
      msg.textContent = "Ukuran karton harus antara 1-100 cm.";
      msg.className = "err";
      return;
    }

    submitBtn.disabled = true;
    msg.textContent = "Mengirim...";
    msg.className = "";

    try {
      const { data, error } = await supabase.rpc("submit_item_baru", {
        p_product_name: document.getElementById("product_name").value,
        p_division: document.getElementById("division").value,
        p_product_group: document.getElementById("product_group").value,
        p_buying_price: parseFloat(buyingInput.value),
        p_selling_price: parseFloat(sellingInput.value),
        p_satuan_besar: document.getElementById("satuan_besar").value,
        p_satuan_kecil: document.getElementById("satuan_kecil").value,
        p_isi_per_karton: parseInt(document.getElementById("isi_per_karton").value),
        p_panjang_cm: p,
        p_lebar_cm: l,
        p_tinggi_cm: t
      });

      if (error) {
        msg.textContent = "Gagal: " + error.message;
        msg.className = "err";
      } else {
        msg.textContent = "Berhasil dikirim! ID: " + data;
        msg.className = "ok";
        form.reset();
        volumePreview.textContent = "Volume: -";
      }
    } catch (err) {
      msg.textContent = "EXCEPTION: " + err.message;
      msg.className = "err";
    }
    submitBtn.disabled = false;
  });
</script>

</body>
</html>
