<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFK RPG — Moonlight Flower</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0d0d1a;color:#e0e0e0;min-height:100vh}
.wrap{max-width:800px;margin:0 auto;padding:10px;display:grid;gap:10px}

/* ── ARENA ── */
.arena-wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;border:2px solid #1a1a3e;box-shadow:0 0 40px #7F77DD44}
.arena-gif{display:block;width:100%;height:auto;image-rendering:auto}
.arena-overlay{position:absolute;inset:0;pointer-events:none}
.boss-hpbar-wrap{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:55%;text-align:center}
.boss-name{font-size:13px;font-weight:600;color:#fff;text-shadow:0 0 8px #000;margin-bottom:3px;letter-spacing:.04em}
.boss-hpbar{height:10px;background:rgba(0,0,0,.5);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.boss-hpfill{height:100%;background:linear-gradient(90deg,#c0392b,#e74c3c);border-radius:5px;transition:width .4s ease;box-shadow:0 0 8px #e74c3c88}
.boss-hpnum{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px}
.hero-hpbar-wrap{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:55%;text-align:center}
.hero-name{font-size:12px;font-weight:600;color:#fff;text-shadow:0 0 8px #000;margin-bottom:3px}
.hero-hpbar{height:8px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.hero-hpfill{height:100%;background:linear-gradient(90deg,#1D9E75,#27ae60);border-radius:4px;transition:width .4s ease}
.hero-spbar{height:5px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;margin-top:3px;border:1px solid rgba(255,255,255,.1)}
.hero-spfill{height:100%;background:linear-gradient(90deg,#7F77DD,#a29bfe);border-radius:3px;transition:width .3s ease}
.dmg-anchor{position:absolute;left:48%;top:18%;width:0;height:0}
.dmg-float{position:absolute;transform:translateX(-50%);font-weight:800;pointer-events:none;white-space:nowrap;animation:floatUp 1.1s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.8)}
@keyframes floatUp{
  0%  {opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  20% {opacity:1;transform:translateX(-50%) translateY(-18px) scale(1.15)}
  100%{opacity:0;transform:translateX(-50%) translateY(-70px) scale(.8)}
}
.dmg-normal{color:#FFD700;font-size:28px}
.dmg-crit  {color:#FF4500;font-size:36px;text-shadow:0 0 12px #FF4500,0 2px 8px #000}
.dmg-skill {color:#BDB2FF;font-size:32px;text-shadow:0 0 14px #a29bfe,0 2px 8px #000}
.dmg-heal  {color:#51e898;font-size:22px}
.skill-flash{position:absolute;left:50%;top:38%;transform:translateX(-50%);
  font-size:16px;font-weight:700;color:#fff;letter-spacing:.08em;
  text-shadow:0 0 12px #BDB2FF, 0 0 24px #7F77DD;
  pointer-events:none;animation:skillFlash .9s ease-out forwards;white-space:nowrap}
@keyframes skillFlash{
  0%  {opacity:0;transform:translateX(-50%) scale(.7)}
  25% {opacity:1;transform:translateX(-50%) scale(1.05)}
  70% {opacity:1}
  100%{opacity:0;transform:translateX(-50%) scale(.95)}
}
.hit-flash{position:absolute;left:30%;top:0;width:40%;height:50%;
  background:radial-gradient(ellipse at center, rgba(255,60,60,.45) 0%, transparent 70%);
  pointer-events:none;border-radius:50%;
  animation:hitFlash .35s ease-out forwards}
@keyframes hitFlash{0%{opacity:1}100%{opacity:0}}

/* Controls */
.ctrlrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:4px 0;align-items:center}
.btn{padding:7px 18px;border-radius:8px;border:1px solid #2a2a5e;background:#16213e;color:#e0e0e0;font-size:13px;cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:#0f3460}.btn:active{transform:scale(.97)}
.btn.run{border-color:#1D9E75;color:#9FE1CB}.btn.run:hover{background:#0F6E56}
.btn.pause{border-color:#E24B4A;color:#F09595}.btn.pause:hover{background:#791F1F}
.btn.edit{border-color:#7F77DD;color:#AFA9EC}.btn.edit:hover{background:#3C3489}
.blog{font-size:12px;color:#7f8fa6;text-align:center;padding:2px 0}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#444;display:inline-block;margin-right:4px;vertical-align:middle}
.sync-dot.ok{background:#1D9E75}
.sync-dot.err{background:#E24B2A}
.sync-dot.syncing{background:#EF9F27}

/* Panels */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:12px}
.ptitle{font-size:11px;font-weight:500;color:#7f8fa6;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.statitem{background:#0d0d1a;border-radius:8px;padding:7px 9px}
.slabel{font-size:10px;color:#7f8fa6;margin-bottom:2px}
.sbar{height:4px;background:#2d3748;border-radius:2px;overflow:hidden;margin-bottom:2px}
.sbfill{height:100%;border-radius:2px;transition:width .5s}
.snum{font-size:12px;font-weight:500;color:#e0e0e0}
.lv{font-size:12px;color:#7f8fa6;margin-bottom:6px}

/* Quest list */
.qlist{display:flex;flex-direction:column;gap:6px}
.qitem{border:1px solid #0f3460;border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:10px;transition:background .15s}
.qitem.done{opacity:.45}
.qname{font-size:12px;font-weight:500;color:#e0e0e0}
.qrew{font-size:10px;color:#7f8fa6;margin-top:2px}

/* Quest editor */
.modal-wrap{display:none;background:#16213e;border-radius:12px;border:1px solid #0f3460;padding:16px}
.modal-wrap h3{font-size:15px;font-weight:500;color:#e0e0e0;margin-bottom:12px}
.qedit-row{border:1px solid #0f3460;border-radius:8px;padding:10px;margin-bottom:8px}
.qedit-row input{width:100%;border:1px solid #0f3460;border-radius:6px;padding:5px 8px;font-size:12px;background:#0d0d1a;color:#e0e0e0;margin-bottom:5px}
.rewgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:5px}
.rewfield{display:flex;flex-direction:column;gap:2px}
.rewfield label{font-size:10px;color:#7f8fa6}
.rewfield input{padding:4px 5px;font-size:12px;margin-bottom:0}
.add-btn{width:100%;padding:7px;border:1px dashed #0f3460;border-radius:8px;background:transparent;color:#7f8fa6;font-size:12px;cursor:pointer;margin-top:4px}
.add-btn:hover{background:#0f3460}
.del-btn{border:none;background:transparent;color:#E24B4A;cursor:pointer;font-size:16px;padding:0 4px}

/* Setup / Login screen */
.setup-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14;display:flex;align-items:center;justify-content:center;z-index:999}
.setup-box{background:#0f0f23;border:1px solid #0f3460;border-radius:12px;padding:32px;width:340px;display:flex;flex-direction:column;gap:14px}
.setup-box h2{color:#AFA9EC;font-size:18px;margin:0}
.setup-box p{color:#7f8fa6;font-size:12px;margin:0}
.setup-input{background:#0a0a14;border:1px solid #0f3460;border-radius:8px;padding:10px 12px;color:#e0e0e0;font-size:13px;width:100%}
.setup-input:focus{outline:none;border-color:#7F77DD}
.setup-btn{background:#26215C;border:1px solid #7F77DD;border-radius:8px;padding:10px;color:#AFA9EC;font-size:13px;cursor:pointer;width:100%}
.setup-btn:hover{background:#7F77DD;color:#fff}
.user-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto}
.user-item{background:#0a0a14;border:1px solid #0f3460;border-radius:8px;padding:10px 14px;color:#e0e0e0;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.user-item:hover{border-color:#7F77DD;background:#26215C}
.user-item .ustats{font-size:11px;color:#7f8fa6}
.err-msg{color:#E24B2A;font-size:11px;display:none}

/* ── Tabs ── */
.tab-bar{display:flex;gap:4px;padding:2px 0 0}
.tab-btn{flex:1;padding:8px 10px;border-radius:8px 8px 0 0;border:1px solid #0f3460;border-bottom:none;background:#0d0d1a;color:#7f8fa6;font-size:12px;font-weight:500;cursor:pointer;letter-spacing:.03em;transition:background .15s,color .15s;text-align:center}
.tab-btn:hover{background:#16213e;color:#c0bfef}
.tab-btn.active{background:#16213e;color:#AFA9EC;border-color:#7F77DD88;border-bottom:1px solid #16213e;position:relative;z-index:1}
.tab-content{display:none;animation:fadeIn .15s ease}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.tab-panel-wrap{background:#16213e;border:1px solid #0f3460;border-radius:0 0 12px 12px;padding:12px;margin-top:-1px}
.tab-panel-wrap.quest-tab-wrap{padding:0;background:transparent;border:none}
</style>
</head>
<body>
<div class="wrap">

<!-- Setup Screen -->
<div class="setup-screen" id="setup-screen">
  <div class="setup-box">
    <h2>⚔️ RPG Tracker</h2>
    <div id="setup-step-url">
      <p>Enter your Google Apps Script URL</p>
      <input class="setup-input" id="input-url" type="text" placeholder="https://script.google.com/...">
      <button class="setup-btn" onclick="submitURL()">Connect</button>
      <p class="err-msg" id="url-error"></p>
    </div>
    <div id="setup-step-user" style="display:none">
      <p>Choose your character</p>
      <div class="user-list" id="user-list"></div>
      <button class="setup-btn" style="margin-top:4px;background:transparent;border-color:#0f3460;color:#7f8fa6" onclick="backToURL()">← Change URL</button>
    </div>
    <div id="setup-step-pin" style="display:none">
      <p id="pin-username-label">Enter PIN</p>
      <input class="setup-input" id="input-pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
      <button class="setup-btn" onclick="submitPin()">Unlock</button>
      <button class="setup-btn" style="margin-top:4px;background:transparent;border-color:#0f3460;color:#7f8fa6" onclick="backToUserList()">← Back</button>
      <p class="err-msg" id="pin-error"></p>
    </div>
  </div>
</div>

<!-- PUT YOUR GIF / ARENA MARKUP HERE — do not change anything in this section -->
  <!-- ARENA -->
  <div class="arena-wrap" id="arena-wrap">
    <video class="arena-gif" id="arena-gif" autoplay loop muted playsinline>
      <source src="arena.mp4" type="video/mp4">
    </video>
    <div class="arena-overlay">

      <!-- Boss HP bar top-center -->
      <div class="boss-hpbar-wrap">
        <div class="boss-name" id="boss-name">🦊 Moonlight Flower</div>
        <div class="boss-hpbar"><div class="boss-hpfill" id="boss-hp" style="width:100%"></div></div>
        <div class="boss-hpnum" id="boss-hpnum">300 / 300</div>
      </div>

      <!-- Hero HP/SP bar bottom-center -->
      <div class="hero-hpbar-wrap">
        <div class="hero-name" id="hero-bar-name">⚔️ Swordsman — Lv <span id="bar-lv">1</span></div>
        <div class="hero-hpbar"><div class="hero-hpfill" id="hero-hp" style="width:100%"></div></div>
        <div class="hero-spbar"><div class="hero-spfill" id="hero-sp" style="width:100%"></div></div>
      </div>

      <!-- Damage anchor at boss head -->
      <div class="dmg-anchor" id="dmg-anchor"></div>
	  <div id="quest-avatar" style="position:absolute;top:10px;left:10px;width:52px;height:52px;border-radius:50%;border:2px solid #E24B2A;overflow:hidden;box-shadow:0 0 8px #E24B2A88;transition:opacity .3s">
  <img src="YOUR_AVATAR_IMAGE.png" style="width:100%;height:100%;object-fit:cover">
  <div id="quest-dot" style="position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#E24B2A;border:2px solid #0d0d1a;box-shadow:0 0 6px #E24B2A"></div>
</div>

    </div>
  </div>

<!-- Controls -->
<div class="ctrlrow">
  <button class="btn run" id="btn-toggle" onclick="toggleBattle()">⏸ Pause</button>
  <button class="btn" onclick="changeSpeed()">⚡ Speed: <span id="spd-lbl">1×</span></button>
  <button class="btn edit" onclick="toggleEditor()">✏️ Edit Quests</button>
  <span style="font-size:12px;color:#7f8fa6;margin-left:4px">
    <span class="sync-dot" id="sync-dot"></span>
    <span id="sync-label">Not connected</span>
  </span>
</div>
<div class="blog" id="blog">Connecting...</div>

<!-- Tabs -->
<div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('hero')">&#9876;&#65039; Hero</button>
    <button class="tab-btn" onclick="switchTab('quests')" id="tab-quests-btn">&#128203; Quests</button>
  </div>

  <!-- Hero Tab -->
  <div class="tab-content active" id="tab-hero">
    <div class="tab-panel-wrap">
      <div class="g2" style="margin-bottom:0">
        <div>
          <div class="ptitle">Hero Stats</div>
          <div class="lv">Lv <strong id="hlv">1</strong> — STR+SPD+Sleep / 10</div>
          <div class="statgrid" id="statgrid"></div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;background:#0d0d1a;border-radius:8px">
            <img src="ticket.png" style="width:28px;height:28px;border-radius:50%">
            <span style="font-size:12px;color:#7f8fa6">Dogen</span>
            <span style="font-size:16px;font-weight:600;color:#AFA9EC;margin-left:auto" id="ticket-count">0</span>
          </div>
        </div>
        <div>
          <div class="ptitle">Stage / Boss</div>
          <div id="stagelist"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Quests Tab -->
  <div class="tab-content" id="tab-quests">
    <div class="tab-panel-wrap">
      <div class="ptitle">Daily Quests — click to complete</div>
      <div class="qlist" id="qlist"></div>
    </div>
  </div>
</div>

<!-- Quest Editor -->
<div class="modal-wrap" id="quest-editor">
  <h3>✏️ Edit Daily Quests</h3>
  <div id="qedit-rows"></div>
  <button class="add-btn" onclick="addQuestRow()">+ Add quest</button>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn" style="flex:1" onclick="saveQuests()">✅ Save & Reset</button>
    <button class="btn" style="flex:1" onclick="toggleEditor()">✖ Cancel</button>
  </div>
</div>

</div><!-- end .wrap -->

<script>
// ── Config ──
const GAS_URL_KEY   = "rpg_gas_url";
const USERNAME_KEY  = "rpg_username";
let GAS_URL         = localStorage.getItem(GAS_URL_KEY)||"";
let CURRENT_USER    = localStorage.getItem(USERNAME_KEY)||"";

// ── Constants ──
const STAT_COLORS = {HP:"#E24B2A",STR:"#E24B4A",SPD:"#378ADD",Sleep:"#7F77DD"};
const STAT_MAX    = {HP:100000,STR:1000,SPD:1000,Sleep:1000};

// ── Dynamic data loaded from sheet ──
let STAGES = [];
let QUESTS = [];
let QUEST_PROGRESS = {};

// ── Game State ──
let S = {
  stats:    {HP:100, STR:10, SPD:10, Sleep:10},
  sp:10, spMax:10,
  heroHP:100, heroMaxHP:100,
  bossHP:300, bossMaxHP:300,
  stageIdx:  0,
  scores:    {},
  tickets:   0,
  running:   false,
};

const SPEEDS=[1,2,4]; let speedIdx=0;
let battleTimer=null, phase="hero", animLock=false;
let saveTimer=null;
let lastDayKey="";

function getStage(){ return STAGES[S.stageIdx]||STAGES[0]; }
function interval(){ return Math.max(100, Math.round(200/SPEEDS[speedIdx])); }
function setText(id,val){ const el=document.getElementById(id); if(el) el.textContent=val; }
function setWidth(id,val){ const el=document.getElementById(id); if(el) el.style.width=val; }
function calcLevel(){
  const total=(S.stats.STR||0)+(S.stats.SPD||0)+(S.stats.Sleep||0);
  return Math.max(1, Math.floor(total/10));
}

// ── Sync Status ──
function setSyncStatus(status, label){
  const dot=document.getElementById("sync-dot");
  const lbl=document.getElementById("sync-label");
  dot.className="sync-dot "+status;
  lbl.textContent=label;
}

// ── API ──
async function apiPost(payload){
  const action = payload.action;
  if(action === "save"){
    const url = GAS_URL + "?action=save&data=" + encodeURIComponent(JSON.stringify(payload));
    const res = await fetch(url);
    return await res.json();
  }
  const params = new URLSearchParams({action});
  if(payload.username) params.append("username", payload.username);
  if(payload.pin) params.append("pin", payload.pin);
  const res = await fetch(GAS_URL + "?" + params.toString());
  return await res.json();
}

// ── Setup / Login ──
async function submitURL(){
  const url = document.getElementById("input-url").value.trim();
  const err = document.getElementById("url-error");
  err.style.display="none";
  if(!url){ err.textContent="Please enter a URL"; err.style.display="block"; return; }
  GAS_URL = url;
  setSyncStatus("syncing","Connecting...");
  try {
    const data = await apiPost({action:"getusers"});
    if(!data.ok) throw new Error(data.error);
    localStorage.setItem(GAS_URL_KEY, url);
    showUserList(data.users);
  } catch(e){
    err.textContent="Connection failed: "+e.message;
    err.style.display="block";
    setSyncStatus("err","Connection failed");
  }
}

let LOCKED_USERS = {};
let CURRENT_PIN = "";

function showUserList(users){
  document.getElementById("setup-step-url").style.display="none";
  document.getElementById("setup-step-pin").style.display="none";
  document.getElementById("setup-step-user").style.display="block";
  LOCKED_USERS = {};
  users.forEach(u=>{ LOCKED_USERS[u.username] = !!u.locked; });
  document.getElementById("user-list").innerHTML = users.map(u=>`
    <div class="user-item" onclick="selectUser('${u.username}')">
      <span>${u.username}${u.locked ? " 🔒" : ""}</span>
      <span class="ustats">STR ${u.STR} · SPD ${u.SPD} · Sleep ${u.Sleep}</span>
    </div>`).join("");
}

let PENDING_USER = "";

async function selectUser(username){
  if(LOCKED_USERS[username]){
    PENDING_USER = username;
    document.getElementById("pin-username-label").textContent = "Enter PIN for "+username;
    document.getElementById("input-pin").value = "";
    document.getElementById("pin-error").style.display="none";
    document.getElementById("setup-step-user").style.display="none";
    document.getElementById("setup-step-pin").style.display="block";
    document.getElementById("input-pin").focus();
    return;
  }
  await doLogin(username, "");
}

async function submitPin(){
  const pin = document.getElementById("input-pin").value.trim();
  const err = document.getElementById("pin-error");
  err.style.display="none";
  if(!pin){ err.textContent="Please enter your PIN"; err.style.display="block"; return; }
  await doLogin(PENDING_USER, pin);
}

function backToUserList(){
  document.getElementById("setup-step-pin").style.display="none";
  document.getElementById("setup-step-user").style.display="block";
}

async function doLogin(username, pin){
  CURRENT_USER = username;
  CURRENT_PIN = pin;
  localStorage.setItem(USERNAME_KEY, username);
  setSyncStatus("syncing","Loading...");
  try {
    const [userData, bossData] = await Promise.all([
      apiPost({action:"getuser",  username, pin}),
      apiPost({action:"getbosses"})
    ]);
    if(!userData.ok){
      if(LOCKED_USERS[username]){
        const err = document.getElementById("pin-error");
        err.textContent = userData.error;
        err.style.display="block";
        setSyncStatus("err","Locked");
        return;
      }
      throw new Error(userData.error);
    }
    if(!bossData.ok) throw new Error(bossData.error);
    STAGES = bossData.bosses;
    applyUserData(userData.user);
    computeOfflineProgress(userData.user.lastActive);
    document.getElementById("setup-screen").style.display="none";
    setSyncStatus("ok","Synced · "+username);
    S.running=true;
    document.getElementById("btn-toggle").className="btn run";
    document.getElementById("btn-toggle").textContent="⏸ Pause";
    scheduleTick();
    setInterval(checkDailyReset, 10000);
  } catch(e){
    setSyncStatus("err","Load failed");
    alert("Failed to load: "+e.message);
  }
}

function backToURL(){
  document.getElementById("setup-step-url").style.display="block";
  document.getElementById("setup-step-user").style.display="none";
}

function applyUserData(user){
  S.stats        = Object.assign({HP:100,STR:10,SPD:10,Sleep:10}, user.stats);
  S.tickets      = user.tickets||0;
  S.scores       = user.scores||{};
  QUESTS         = user.questDefinitions||[];
  QUEST_PROGRESS = Object.assign({}, user.questProgress);
  QUESTS.forEach(q=>{ if(QUEST_PROGRESS[q.id]===undefined) QUEST_PROGRESS[q.id]=0; });
  lastDayKey = user.lastDay ? String(user.lastDay) : getTodayKeyGMT7();
  S.heroMaxHP    = Math.round(100+(S.stats.STR-10)*2);
  S.heroHP       = S.heroMaxHP;
  if(STAGES.length>0){
    const st=STAGES[S.stageIdx]||STAGES[0];
    S.bossHP=st.hp; S.bossMaxHP=st.hp;
    setText("boss-name", st.name);
  }
  renderStats(); renderStages(); renderQuests(); updateArenaUI(); updateQuestTabBadge();
}

// ── Save ──
function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(pushSave, 2000);
}

async function pushSave(){
  if(!CURRENT_USER||!GAS_URL) return;
  setSyncStatus("syncing","Saving...");
  try {
    const data = await apiPost({
      action:          "save",
      username:        CURRENT_USER,
      pin:             CURRENT_PIN,
      stats:           S.stats,
      scores:          S.scores,
      questProgress:   QUEST_PROGRESS,
      questDefinitions:QUESTS,
      lastDay:         lastDayKey,
      lastActive:      new Date().toISOString(),
      tickets:         S.tickets||0
    });
    if(!data.ok) throw new Error(data.error);
    setSyncStatus("ok","Synced · "+CURRENT_USER);
  } catch(e){
    setSyncStatus("err","Save failed");
  }
}

// ── Battle Loop ──
function scheduleTick(){
  if(!S.running) return;
  battleTimer=setTimeout(tick, interval());
}

function tick(){
  if(!S.running||animLock){ scheduleTick(); return; }
  if(phase==="hero") heroTurn(); else enemyTurn();
}

function heroTurn(){
  animLock=true;
  const isCrit=Math.random()<0.15;
  const useSkill=S.sp>=5&&Math.random()<0.25;
  let dmg,cls;
  if(useSkill){
    S.sp-=5;
    dmg=Math.round(S.stats.STR*2.4+S.stats.SPD*0.6+Math.random()*10);
    cls="dmg-skill";
    showSkillFlash("✨ Axe Boomerang!!");
  } else if(isCrit){
    dmg=Math.round(S.stats.STR*1.8+Math.random()*8);
    cls="dmg-crit";
  } else {
    dmg=Math.round(S.stats.STR*(0.8+Math.random()*0.4));
    cls="dmg-normal";
  }
  S.sp=Math.min(S.spMax, S.sp+1.5);
  S.bossHP=Math.max(0, S.bossHP-dmg);
  spawnDmg(dmg,cls);
  showHitFlash();
  updateArenaUI();
  setLog((useSkill?"✨ Axe Boomerang!!":isCrit?"💥 CRITICAL HIT!!":"⚔️ You hit "+getStage().name)+" for "+dmg+"!");
  if(S.bossHP<=0){ setTimeout(()=>{ endBattle(true); animLock=false; },400); return; }
  setTimeout(()=>{ phase="enemy"; animLock=false; scheduleTick(); },350);
}

function enemyTurn(){
  animLock=true;
  const stage=getStage();
  const dodge=S.stats.SPD>15&&Math.random()<(S.stats.SPD-10)*0.007;
  if(dodge){
    setLog("💨 Dodged "+stage.name+"'s attack!");
    spawnDmg("MISS","dmg-heal");
    phase="hero"; animLock=false; scheduleTick(); return;
  }
  const def=Math.round(S.stats.Sleep*0.04);
  const d=Math.max(1, stage.atk-def+Math.round((Math.random()-.5)*6));
  S.heroHP=Math.max(0, S.heroHP-d);
  setLog("💥 "+stage.name+" hits you for "+d+"!");
  updateArenaUI();
  if(S.heroHP<=0){ setTimeout(()=>{ endBattle(false); animLock=false; },300); return; }
  phase="hero"; animLock=false; scheduleTick();
}

function endBattle(won){
  if(battleTimer) clearTimeout(battleTimer);
  const st=getStage();
  if(!S.scores[st.id]) S.scores[st.id]=0;
  if(won){
    S.scores[st.id]++;
    let logMsg = "🏆 "+st.name+" defeated!";
    if(Math.random() < 0.01){
      const ticketGain = Math.pow(2, S.stageIdx);
      S.tickets = (S.tickets||0) + ticketGain;
      logMsg += " 🎫 +"+ticketGain+" ticket"+(ticketGain>1?"s":"")+"!";
    }
    setLog(logMsg);
    renderStats(); renderStages();
    scheduleSave();
    setTimeout(()=>{ resetBoss(); scheduleTick(); },1000);
  } else {
    S.scores[st.id]=Math.max(0, S.scores[st.id]-1);
    S.heroHP=S.heroMaxHP;
    setLog("💀 Defeated... recovering!");
    renderStats(); renderStages();
    scheduleSave();
    setTimeout(()=>{ phase="hero"; animLock=false; scheduleTick(); },1400);
  }
  updateArenaUI();
}

function resetBoss(){
  const st=getStage();
  S.bossHP=st.hp; S.bossMaxHP=st.hp;
  setText("boss-name", st.name);
  phase="hero"; animLock=false;
  updateArenaUI();
}

// ── Visual Effects ──
function spawnDmg(val,cls){
  const anchor=document.getElementById("dmg-anchor");
  if(!anchor) return;
  const el=document.createElement("div");
  el.className="dmg-float "+cls;
  el.style.left=(Math.random()-0.5)*60+"px";
  el.style.top=(Math.random())*(-20)+"px";
  el.textContent=(typeof val==="number")?val.toLocaleString():val;
  anchor.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}

function showSkillFlash(text){
  const overlay=document.querySelector(".arena-overlay");
  if(!overlay) return;
  const el=document.createElement("div");
  el.className="skill-flash"; el.textContent=text;
  overlay.appendChild(el);
  setTimeout(()=>el.remove(),950);
}

function showHitFlash(){
  const overlay=document.querySelector(".arena-overlay");
  if(!overlay) return;
  const el=document.createElement("div");
  el.className="hit-flash";
  overlay.appendChild(el);
  setTimeout(()=>el.remove(),380);
}

// ── UI Updates ──
function updateArenaUI(){
  if(!STAGES.length) return;
  setWidth("boss-hp", Math.max(0,S.bossHP/S.bossMaxHP*100)+"%");
  setText("boss-hpnum", Math.max(0,Math.round(S.bossHP))+" / "+S.bossMaxHP);
  setWidth("hero-hp", Math.max(0,S.heroHP/S.heroMaxHP*100)+"%");
  setWidth("hero-sp", (S.sp/S.spMax*100)+"%");
  setText("bar-lv", calcLevel());
  document.getElementById("hlv").textContent        = calcLevel();
}

function renderStats(){
  const tc=document.getElementById("ticket-count");
  if(tc) tc.textContent=S.tickets||0;
  document.getElementById("statgrid").innerHTML=Object.entries(S.stats).map(([k,v])=>{
    const pct=Math.round(v/(STAT_MAX[k]||1000)*100);
    return `<div class="statitem">
      <div class="slabel">${k}</div>
      <div class="sbar"><div class="sbfill" style="width:${pct}%;background:${STAT_COLORS[k]||'#888'}"></div></div>
      <div class="snum">${Math.round(v)}</div>
    </div>`;
  }).join("");
}

function renderStages(){
  if(!STAGES.length){ document.getElementById("stagelist").innerHTML="<div style='color:#7f8fa6;font-size:12px'>Loading...</div>"; return; }
  document.getElementById("stagelist").innerHTML=STAGES.map((st,i)=>{
    const lck=S.stats.STR<st.reqSTR;
    const sel=S.stageIdx===i;
    const score=S.scores[st.id]||0;
    return `<div onclick="${lck?"":"selectStage("+i+")"}"
      style="display:flex;align-items:center;justify-content:space-between;
             border:1px solid ${sel?"#7F77DD":lck?"#1a1a3e":"#0f3460"};border-radius:8px;padding:8px 10px;
             cursor:${lck?"not-allowed":"pointer"};background:${sel?"#26215C":lck?"#0a0a14":"transparent"};
             opacity:${lck?.4:1};transition:background .15s;margin-bottom:6px">
      <div>
        <div style="font-size:12px;font-weight:500;color:#e0e0e0">${st.name}${sel?" <span style='color:#AFA9EC;font-size:10px'>▶</span>":""}</div>
        <div style="font-size:10px;color:#7f8fa6">${lck?"🔒 STR ≥ "+st.reqSTR:"HP "+st.hp}</div>
      </div>
      <div style="font-size:16px;font-weight:600;color:${score>0?"#AFA9EC":"#444"};min-width:24px;text-align:right">${score}</div>
    </div>`;
  }).join("");
}

function selectStage(idx){
  const st=STAGES[idx];
  if(S.stats.STR<st.reqSTR) return;
  if(battleTimer) clearTimeout(battleTimer);
  S.stageIdx=idx; S.heroHP=S.heroMaxHP;
  S.bossHP=st.hp; S.bossMaxHP=st.hp;
  setText("boss-name", st.name);
  phase="hero"; animLock=false;
  updateArenaUI(); renderStages();
  setLog(st.name+" appeared!");
  if(S.running) scheduleTick();
}

function renderQuests(){
  if(!QUESTS.length){ document.getElementById("qlist").innerHTML="<div style='color:#7f8fa6;font-size:12px'>No quests loaded.</div>"; return; }
  document.getElementById("qlist").innerHTML=QUESTS.map(q=>{
    const cur=QUEST_PROGRESS[q.id]||0;
    const done=cur>=q.max;
    const pct=Math.round(cur/q.max*100);
    const rewText=Object.entries(q.rewards).filter(([k,v])=>v>0).map(([k,v])=>`${k} +${v}`).join(" · ");
    return `<div class="qitem${done?" done":""}" style="position:relative">
  <div style="position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:${done?"#1D9E75":"#E24B2A"};border:2px solid #0d0d1a;box-shadow:0 0 6px ${done?"#1D9E75":"#E24B2A"};display:block"></div>
      <span style="font-size:20px">${q.emoji}</span>
      <div style="flex:1">
        <div class="qname">${done?"✅ ":""}${q.name}</div>
        <div class="qrew">${rewText}</div>
        <div style="margin-top:5px;height:4px;background:#0f3460;border-radius:4px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:#7F77DD;border-radius:4px;transition:width .2s"></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;margin-left:10px">
        <div style="font-size:11px;color:#7f8fa6">${cur} / ${q.max}</div>
        <button onclick="${done?"":"doQuest('"+q.id+"')"}"
          style="padding:3px 10px;font-size:11px;border-radius:6px;border:1px solid ${done?"#1a1a3e":"#7F77DD"};
                 background:${done?"transparent":"#26215C"};color:${done?"#444":"#AFA9EC"};
                 cursor:${done?"not-allowed":"pointer"};" ${done?"disabled":""}>
          ${done?"Done":"Submit"}
        </button>
      </div>
    </div>`;
  }).join("");
}

let lastQuestAction = null;

function doQuest(id){
  const q=QUESTS.find(x=>x.id===id); if(!q) return;
  if(QUEST_PROGRESS[id]>=q.max) return;
  QUEST_PROGRESS[id]++;
  Object.entries(q.rewards).forEach(([k,v])=>{
    S.stats[k]=Math.max(0,Math.min(STAT_MAX[k]||1000,(S.stats[k]||0)+v));
  });
  S.heroMaxHP=Math.round(100+(S.stats.STR-10)*2);
  S.heroHP=Math.min(S.heroHP+15, S.heroMaxHP);
  lastQuestAction = {id, rewards: q.rewards};
  renderStats(); renderStages(); renderQuests(); updateArenaUI(); updateQuestTabBadge();
  setLog("Quest: "+q.name+" — "+QUEST_PROGRESS[id]+"/"+q.max+"! Stats improved.");
  scheduleSave();
  showUndoButton();
}

let undoTimer=null;
function showUndoButton(){
  const existing=document.getElementById("undo-btn");
  if(existing) existing.remove();
  if(undoTimer) clearTimeout(undoTimer);
  const btn=document.createElement("button");
  btn.id="undo-btn";
  btn.textContent="↩ Undo last submit";
  btn.style="position:fixed;bottom:20px;right:20px;padding:8px 16px;background:#26215C;border:1px solid #7F77DD;border-radius:8px;color:#AFA9EC;font-size:13px;cursor:pointer;z-index:999";
  btn.onclick=undoQuest;
  document.body.appendChild(btn);
  undoTimer=setTimeout(()=>{ btn.remove(); lastQuestAction=null; },5000);
}

function undoQuest(){
  if(!lastQuestAction) return;
  const {id, rewards}=lastQuestAction;
  QUEST_PROGRESS[id]=Math.max(0, QUEST_PROGRESS[id]-1);
  Object.entries(rewards).forEach(([k,v])=>{
    S.stats[k]=Math.max(0,(S.stats[k]||0)-v);
  });
  S.heroMaxHP=Math.round(100+(S.stats.STR-10)*2);
  S.heroHP=Math.min(S.heroHP, S.heroMaxHP);
  lastQuestAction=null;
  const btn=document.getElementById("undo-btn");
  if(btn) btn.remove();
  if(undoTimer) clearTimeout(undoTimer);
  renderStats(); renderStages(); renderQuests(); updateArenaUI();
  setLog("↩ Undid last quest submit.");
  scheduleSave();
}

function setLog(msg){ document.getElementById("blog").textContent=msg; }

function toggleBattle(){
  S.running=!S.running;
  const btn=document.getElementById("btn-toggle");
  if(S.running){
    btn.className="btn run"; btn.textContent="⏸ Pause";
    phase="hero"; animLock=false; scheduleTick();
  } else {
    if(battleTimer) clearTimeout(battleTimer);
    btn.className="btn pause"; btn.textContent="▶ Resume";
  }
}

function changeSpeed(){
  speedIdx=(speedIdx+1)%SPEEDS.length;
  document.getElementById("spd-lbl").textContent=SPEEDS[speedIdx]+"×";
}

function toggleEditor(){
  const ed=document.getElementById("quest-editor");
  if(ed.style.display==="none"||!ed.style.display){
    if(battleTimer) clearTimeout(battleTimer);
    S.running=false;
    document.getElementById("btn-toggle").className="btn pause";
    document.getElementById("btn-toggle").textContent="▶ Resume";
    buildEditorRows(); ed.style.display="block";
    ed.scrollIntoView({behavior:"smooth"});
  } else {
    ed.style.display="none";
  }
}

function buildEditorRows(){
  const stats=["STR","SPD","Sleep","HP"];
  document.getElementById("qedit-rows").innerHTML="";
  QUESTS.forEach((q,i)=>{
    const row=document.createElement("div"); row.className="qedit-row";
    row.innerHTML=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
      <input type="text" value="${q.emoji}" style="width:48px" id="eq${i}-emoji">
      <input type="text" value="${q.name}" style="flex:1" id="eq${i}-name">
      <input type="number" value="${q.max}" style="width:52px" id="eq${i}-max" min="1">
      <button class="del-btn" onclick="removeQuestRow(${i})">🗑</button>
    </div>
    <div class="rewgrid">${stats.map(s=>`<div class="rewfield"><label>${s}</label><input type="number" step="1" value="${q.rewards[s]||0}" id="eq${i}-${s}"></div>`).join("")}</div>`;
    document.getElementById("qedit-rows").appendChild(row);
  });
}

function addQuestRow(){
  QUESTS.push({id:"q"+Date.now(),name:"New quest",emoji:"⭐",rewards:{STR:0,SPD:0,Sleep:0,HP:0},max:10});
  buildEditorRows();
}
function removeQuestRow(i){ QUESTS.splice(i,1); buildEditorRows(); }

function saveQuests(){
  const stats=["STR","SPD","Sleep","HP"];
  QUESTS=QUESTS.map((q,i)=>({
    ...q,
    name: document.getElementById("eq"+i+"-name").value.trim()||q.name,
    emoji:document.getElementById("eq"+i+"-emoji").value.trim()||q.emoji,
    max:  parseInt(document.getElementById("eq"+i+"-max").value)||10,
    rewards:Object.fromEntries(stats.map(s=>[s,parseInt(document.getElementById("eq"+i+"-"+s).value)||0]))
  }));
  QUESTS.forEach(q=>{ if(QUEST_PROGRESS[q.id]===undefined) QUEST_PROGRESS[q.id]=0; });
  renderQuests();
  document.getElementById("quest-editor").style.display="none";
  setLog("Quests updated!");
  S.running=true;
  document.getElementById("btn-toggle").className="btn run";
  document.getElementById("btn-toggle").textContent="⏸ Pause";
  scheduleTick();
  scheduleSave();
}

// ── Tabs ──
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  event.currentTarget.classList.add('active');
}

function updateQuestTabBadge(){
  const btn = document.getElementById('tab-quests-btn');
  if(!btn) return;
  const pending = QUESTS.filter(q => (QUEST_PROGRESS[q.id]||0) < q.target).length;
  btn.textContent = pending > 0
    ? '\uD83D\uDCCB Quests \u00B7 ' + pending
    : '\uD83D\uDCCB Quests';
}

// ── Daily Reset & Stat Decay (5:00 AM GMT+7) ──
function getTodayKeyGMT7(){
  const now=new Date();
  const gmt7=new Date(now.getTime()+7*3600*1000);
  const h=gmt7.getUTCHours();
  let y,m,d;
  if(h<5){
    const yesterday=new Date(gmt7.getTime()-86400000);
    y=yesterday.getUTCFullYear(); m=yesterday.getUTCMonth()+1; d=yesterday.getUTCDate();
  } else {
    y=gmt7.getUTCFullYear(); m=gmt7.getUTCMonth()+1; d=gmt7.getUTCDate();
  }
  return "D"+y+"-"+(m<10?"0"+m:m)+"-"+(d<10?"0"+d:d);
}

function checkDailyReset(){
  const key=getTodayKeyGMT7();
  if(key!==lastDayKey){
    lastDayKey=key;
    Object.keys(S.stats).forEach(k=>{ S.stats[k]=Math.max(0,S.stats[k]-5); });
    QUESTS.forEach(q=>{ QUEST_PROGRESS[q.id]=0; });
    S.heroMaxHP=Math.round(100+(S.stats.STR-10)*2);
    S.heroHP=Math.min(S.heroHP,S.heroMaxHP);
    renderStats(); renderStages(); renderQuests(); updateArenaUI(); updateQuestTabBadge();
    setLog("🌅 New day! Stats decayed -5. Quests reset.");
    scheduleSave();
  }
}

// ── Offline Progress ──
function simulateOffline(elapsedMs){
  const st = getStage();
  const skillDmg = S.stats.STR*2.4 + S.stats.SPD*0.6 + 5;
  const critDmg  = S.stats.STR*1.8 + 4;
  const normDmg  = S.stats.STR*1.0;
  const avgHeroDmg = 0.25*skillDmg + 0.15*critDmg + 0.6*normDmg;

  const def = S.stats.Sleep*0.04;
  const avgEnemyDmg = Math.max(1, st.atk - def);
  const dodge = Math.min(0.9, Math.max(0, (S.stats.SPD-10)*0.007));
  const effEnemyDmg = avgEnemyDmg * (1-dodge);

  const turnsToKill = Math.max(1, Math.ceil(st.hp / avgHeroDmg));
  const dmgTakenPerBattle = (turnsToKill-1) * effEnemyDmg;
  const survives = dmgTakenPerBattle < S.heroMaxHP;

  const avgRoundMs = turnsToKill*2*interval() + (survives?1000:1400);
  const rounds = Math.floor(elapsedMs / avgRoundMs);

  if(rounds<=0) return;

  let wins=0, losses=0;
  if(survives){ wins=rounds; } else { losses=rounds; }

  if(!S.scores[st.id]) S.scores[st.id]=0;
  S.scores[st.id] = Math.max(0, S.scores[st.id] + wins - losses);

  let ticketsGained = 0;
  const ticketValue = Math.pow(2, S.stageIdx);
  for(let i=0; i<wins; i++){
    if(Math.random() < 0.01) ticketsGained += ticketValue;
  }
  S.tickets = (S.tickets||0) + ticketsGained;

  renderStages(); renderStats();
  showOfflinePopup(st, wins, losses, elapsedMs, ticketsGained);
}

function showOfflinePopup(st, wins, losses, elapsedMs, ticketsGained){
  const totalMin = Math.round(elapsedMs/60000);
  const hrs = Math.floor(totalMin/60);
  const mins = totalMin%60;
  const timeStr = hrs>0 ? hrs+"h "+mins+"m" : mins+"m";

  const overlay=document.createElement("div");
  overlay.style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999";

  const box=document.createElement("div");
  box.style="background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:24px;width:300px;text-align:center;color:#e0e0e0";

  box.innerHTML=`
    <div style="font-size:18px;font-weight:600;margin-bottom:6px">⏱️ Welcome back!</div>
    <div style="font-size:12px;color:#7f8fa6;margin-bottom:14px">You were away for ${timeStr}</div>
    <div style="font-size:13px;margin-bottom:6px">vs ${st.name}</div>
    <div style="font-size:13px;color:#1D9E75;margin-bottom:4px">🏆 Wins: ${wins}</div>
    <div style="font-size:13px;color:#E24B2A;margin-bottom:${ticketsGained>0?6:14}px">💀 Losses: ${losses}</div>
    ${ticketsGained>0?`<div style="font-size:13px;color:#AFA9EC;margin-bottom:14px">🎫 Tickets earned: ${ticketsGained}</div>`:""}
    <button class="btn run" style="width:100%" id="offline-ok">Continue</button>
  `;

  overlay.appendChild(box);
  document.body.appendChild(overlay);
  document.getElementById("offline-ok").onclick=()=>{ overlay.remove(); scheduleSave(); };
}

function computeOfflineProgress(lastActiveStr){
  if(!lastActiveStr) return;
  const elapsed = Date.now() - new Date(lastActiveStr).getTime();
  if(elapsed < 60000) return;
  setTimeout(()=>simulateOffline(elapsed), 300);
}

// ── Init ──
// If we have a saved URL and username, try to auto-login
(async function init(){
  if(GAS_URL && CURRENT_USER){
    setSyncStatus("syncing","Reconnecting...");
    document.getElementById("setup-screen").style.display="flex";
    try {
      const [userData, bossData] = await Promise.all([
        apiPost({action:"getuser",  username:CURRENT_USER, pin:CURRENT_PIN}),
        apiPost({action:"getbosses"})
      ]);
      if(userData.error === "Invalid PIN"){
        LOCKED_USERS[CURRENT_USER] = true;
        PENDING_USER = CURRENT_USER;
        document.getElementById("setup-step-url").style.display="none";
        document.getElementById("pin-username-label").textContent = "Enter PIN for "+CURRENT_USER;
        document.getElementById("input-pin").value = "";
        document.getElementById("pin-error").style.display="none";
        document.getElementById("setup-step-pin").style.display="block";
        document.getElementById("input-pin").focus();
        setSyncStatus("err","Locked");
        return;
      }
      if(!userData.ok || !bossData.ok) throw new Error("reload failed");
      STAGES = bossData.bosses;
      applyUserData(userData.user);
      computeOfflineProgress(userData.user.lastActive);
      document.getElementById("setup-screen").style.display="none";
      setSyncStatus("ok","Synced · "+CURRENT_USER);
      S.running=true;
      document.getElementById("btn-toggle").className="btn run";
      document.getElementById("btn-toggle").textContent="⏸ Pause";
      scheduleTick();
      setInterval(checkDailyReset,10000);
    } catch(e){
      setSyncStatus("err","Auto-login failed");
      document.getElementById("input-url").value=GAS_URL;
    }
  } else if(GAS_URL){
    document.getElementById("input-url").value=GAS_URL;
  }
})();
